<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Coming Soon</title>
  <meta name="description" content="Coming Soon">
  <meta name="theme-color" content="#24050d">
  <meta name="color-scheme" content="dark">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232b0811'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23faf7f2' opacity='0.9'/%3E%3C/svg%3E">

  <!-- Preconnect to Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

  <!-- Preload critical background for rapid paint -->
  <link rel="preload" as="image" href="assets/burgundy-fabric-desktop.webp" media="(min-width: 769px)" type="image/webp">
  <link rel="preload" as="image" href="assets/burgundy-fabric-mobile.webp" media="(max-width: 768px)" type="image/webp">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fullscreen Cinematic Fabric Stage -->
  <main class="stage" id="stage" aria-label="Coming Soon">
    
    <!-- Background Silk Fabric Container with Breathing & Parallax -->
    <div class="fabric-container" id="fabricContainer">
      <picture class="fabric-picture">
        <!-- Desktop / Landscape 2x Retina -->
        <source media="(min-width: 769px) and (-webkit-min-device-pixel-ratio: 1.5)" srcset="assets/burgundy-fabric-desktop@2x.webp" type="image/webp">
        <source media="(min-width: 769px) and (-webkit-min-device-pixel-ratio: 1.5)" srcset="assets/burgundy-fabric-desktop@2x.jpg" type="image/jpeg">
        <!-- Desktop / Landscape Standard -->
        <source media="(min-width: 769px)" srcset="assets/burgundy-fabric-desktop.webp" type="image/webp">
        <source media="(min-width: 769px)" srcset="assets/burgundy-fabric-desktop.jpg" type="image/jpeg">

        <!-- Mobile / Portrait 2x Retina -->
        <source media="(-webkit-min-device-pixel-ratio: 1.5)" srcset="assets/burgundy-fabric-mobile@2x.webp" type="image/webp">
        <source media="(-webkit-min-device-pixel-ratio: 1.5)" srcset="assets/burgundy-fabric-mobile@2x.jpg" type="image/jpeg">
        <!-- Mobile / Portrait Standard -->
        <source srcset="assets/burgundy-fabric-mobile.webp" type="image/webp">
        
        <!-- Base Fallback Image -->
        <img 
          src="assets/burgundy-fabric-mobile.jpg" 
          alt="" 
          role="presentation"
          class="fabric-img" 
          id="fabricImg"
          fetchpriority="high" 
          decoding="async"
        >
      </picture>
    </div>

    <!-- Cinematic Vignette & Ambient Shimmer Overlay -->
    <div class="cinematic-lighting" id="cinematicLighting" aria-hidden="true"></div>

    <!-- Ultra-subtle Micro Silk Film Grain -->
    <div class="editorial-grain" aria-hidden="true"></div>

    <!-- Center Typography: ONLY COMING SOON -->
    <div class="content-wrapper" aria-live="polite">
      <h1 class="coming-soon" id="comingSoonText">COMING SOON</h1>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
